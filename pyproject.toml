[project]
name = "fastapi-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sameer Singh" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.10",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.9.0",
    "pymysql",
    "python-dotenv>=1.2.3",
    "sqlalchemy",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
fastapi-tutorial = "fastapi_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
